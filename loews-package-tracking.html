<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Package Tracking">
<meta name="theme-color" content="#0a2540">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loews Package Tracking</title>
<style>
:root{
  --navy:#0F2440; --navy2:#1E3A5F; --navy3:#0B1C33;
  --gold:#C9A96A; --gold-deep:#A8823F; --gold-soft:#F5EDDA;
  --bg:#F1F3F6; --card:#ffffff;
  --ink:#1A2332; --muted:#66788D; --line:#DEE4EC;
  --green:#1B7A43; --green-bg:#E3F2E9; --green-bd:#BFE3CC;
  --amber:#96620A; --amber-bg:#FCF0D8; --amber-bd:#F0D9A8;
  --red:#B3261E; --red-bg:#FBE7E5; --red-bd:#F0C4C1;
  --blue:#1A5FB4; --blue-bg:#E4EDFA; --blue-bd:#C2D6F2;
  --gray:#5F6B7A; --gray-bg:#EDF0F4; --gray-bd:#D5DBE3;
  --purple:#6A3FB5; --purple-bg:#ECE5F9; --purple-bd:#D5C6F0;
  --shadow-sm:0 1px 2px rgba(15,36,64,.06),0 1px 3px rgba(15,36,64,.05);
  --shadow-md:0 6px 16px rgba(15,36,64,.10),0 2px 5px rgba(15,36,64,.06);
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); padding-bottom:92px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
header{background:linear-gradient(135deg,var(--navy3),var(--navy) 55%,var(--navy2)); color:#fff;
  padding:18px 16px 14px; position:sticky; top:0; z-index:20;}
header h1{margin:0; font-size:19px; letter-spacing:.3px;}
header h1 .gold{color:var(--gold);}
header p{margin:4px 0 0; font-size:12px; color:#b9c7d8;}
header.branded{padding:0; background:
  radial-gradient(120% 90% at 50% 0%, rgba(201,169,106,.14), transparent 55%),
  linear-gradient(135deg,var(--navy3) 0%,var(--navy) 48%,var(--navy2) 100%);
  border-bottom:3px solid var(--gold);}
.logos{display:flex; align-items:center; justify-content:center; gap:14px; padding:18px 16px 12px;}
.logos img{max-height:44px; width:auto; max-width:28%; object-fit:contain;
  background:#fff; border-radius:10px; padding:7px 12px;
  box-shadow:0 3px 10px rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.35);}
.apptitle{background:transparent; color:#fff; padding:2px 16px 16px; text-align:center;}
.apptitle h1{margin:0; font-size:21px; font-weight:800; letter-spacing:2.5px; text-transform:uppercase; color:#fff;}
.apptitle p{margin:6px 0 0; font-size:12px; color:#A9BCD2; letter-spacing:.4px;}
.apptitle::after{content:""; display:block; height:3px; width:60px; border-radius:2px;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold)); margin:11px auto 0;}
#propbar{display:flex; gap:8px; overflow-x:auto; padding:12px; background:#fff;
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:19;
  box-shadow:0 2px 8px rgba(15,36,64,.05);
  scrollbar-width:none;}
#propbar::-webkit-scrollbar{display:none;}
/* note: propbar sits under header; header height varies so we keep propbar static instead */
#propbar{position:static;}
.chip{flex:0 0 auto; border:1.5px solid var(--line); background:#fff; color:var(--ink);
  border-radius:999px; padding:8px 15px; font-size:13px; font-weight:700; cursor:pointer;
  transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,transform .1s ease;}
.chip:active{transform:scale(.96);}
.chip.active{background:linear-gradient(180deg,var(--navy2),var(--navy)); border-color:var(--navy); color:#fff;
  box-shadow:0 2px 8px rgba(15,36,64,.28);}
main{max-width:620px; margin:0 auto; padding:14px 12px;}
section.tab{display:none;}
section.tab.active{display:block; animation:tabIn .2s ease;}
@keyframes tabIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:12px; box-shadow:var(--shadow-sm);}
.card h3{margin:0 0 10px; font-size:15px; font-weight:800; color:var(--navy); letter-spacing:.2px;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.tile{flex:1 1 0; min-width:110px; background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); padding:15px 10px 13px; text-align:center; box-shadow:var(--shadow-sm);
  position:relative; overflow:hidden; transition:transform .15s ease, box-shadow .15s ease;}
.tile::before{content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--navy),var(--navy2));}
.tile .n{font-size:30px; font-weight:800; color:var(--navy); line-height:1.1;
  font-variant-numeric:tabular-nums; letter-spacing:-.5px;}
.tile .l{font-size:10.5px; font-weight:800; color:var(--muted); margin-top:5px;
  text-transform:uppercase; letter-spacing:.8px;}
.tile.warn::before{background:linear-gradient(90deg,var(--gold-deep),var(--gold));}
.tile.warn .n{color:var(--amber);}
.tile.bad::before{background:linear-gradient(90deg,#8E1F19,var(--red));}
.tile.bad{background:#FFFDFB;}
.tile.bad .n{color:var(--red);}
.radio{cursor:pointer;}
.radio-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.radio-id{font-size:17px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums; letter-spacing:.2px;}
.radio{transition:transform .12s ease, box-shadow .12s ease;}
.radio:active{transform:scale(.99);}
.radio-meta{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.5;}
.badge{display:inline-block; font-size:10.5px; font-weight:800; padding:4px 11px; border-radius:999px;
  text-transform:uppercase; letter-spacing:.6px; white-space:nowrap; border:1px solid transparent;}
.b-green{background:var(--green-bg); color:var(--green); border-color:var(--green-bd);}
.b-amber{background:var(--amber-bg); color:var(--amber); border-color:var(--amber-bd);}
.b-red{background:var(--red-bg); color:var(--red); border-color:var(--red-bd);}
.b-purple{background:var(--purple-bg); color:var(--purple); border-color:var(--purple-bd);}
.b-blue{background:var(--blue-bg); color:var(--blue); border-color:var(--blue-bd);}
.b-gray{background:var(--gray-bg); color:var(--gray); border-color:var(--gray-bd);}
.pchip{display:inline-block; font-size:11px; font-weight:800; background:var(--navy); color:#fff;
  border-radius:6px; padding:3px 8px; letter-spacing:.5px; margin-right:6px;}
.doc{cursor:pointer;}
.doc-title{font-size:15px; font-weight:700;}
.doc-meta{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.5;}
.btn{display:inline-block; border:none; border-radius:12px; padding:14px 16px; font-size:15px;
  font-weight:800; letter-spacing:.2px; cursor:pointer; text-align:center;
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;}
.btn:active{transform:scale(.985);}
.btn-primary{background:linear-gradient(180deg,var(--navy2),var(--navy)); color:#fff; width:100%;
  box-shadow:0 3px 10px rgba(15,36,64,.28);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold-deep)); color:#1c2733; width:100%;
  box-shadow:0 3px 10px rgba(168,130,63,.30);}
.btn-ghost{background:#fff; color:var(--navy); border:1.5px solid var(--navy); width:100%; margin-top:8px;}
.btn-ghost:hover{background:#F4F7FB;}
.btn-danger{background:#fff; color:var(--red); border:1.5px solid var(--red); width:100%; margin-top:8px;}
.btn-danger:hover{background:#FDF3F2;}
.btn-sm{width:auto; padding:10px 16px; font-size:14px;}
.toolbar{display:flex; gap:8px; margin-bottom:12px;}
.toolbar input{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; font-size:15px;}
select,input[type=text],input[type=date],input[type=datetime-local],textarea{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px;
  font-size:15px; margin:6px 0 12px; font-family:inherit; background:#fff; color:var(--ink);
  transition:border-color .15s ease, box-shadow .15s ease;}
select:focus,input[type=text]:focus,input[type=date]:focus,input[type=datetime-local]:focus,textarea:focus,
input[type=password]:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(15,36,64,.13);}
label{font-size:12px; font-weight:800; color:var(--navy); text-transform:uppercase; letter-spacing:.6px;}
#bottomnav{position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.97);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-top:1px solid var(--line); box-shadow:0 -3px 14px rgba(15,36,64,.07);
  display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom);}
#bottomnav button{flex:1; border:none; background:none; padding:12px 0 10px; font-size:10.5px;
  font-weight:800; letter-spacing:.4px; color:var(--muted); cursor:pointer; position:relative;
  transition:color .15s ease;}
#bottomnav button.active{color:var(--navy);}
#bottomnav button.active::after{content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:34px; height:3px; border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold));}
#bottomnav button .ico{display:block; font-size:19px; margin-bottom:3px;}
#modal{position:fixed; inset:0; background:rgba(11,28,51,.6); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  display:none; z-index:50; align-items:flex-end; justify-content:center;}
#modal.open{display:flex; animation:modalIn .2s ease;}
@keyframes modalIn{from{opacity:0;} to{opacity:1;}}
#sheet{background:#fff; width:100%; max-width:620px; max-height:92vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:10px 18px 34px;
  box-shadow:0 -10px 40px rgba(0,0,0,.25); animation:sheetUp .26s cubic-bezier(.2,.9,.3,1.05);}
@keyframes sheetUp{from{transform:translateY(48px); opacity:.4;} to{transform:none; opacity:1;}}
#sheet::before{content:""; display:block; width:46px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 14px;}
#sheet h2{margin:0 0 4px; font-size:19px; font-weight:800; color:var(--navy); letter-spacing:.2px;}
#sheet .sub{font-size:13px; color:var(--muted); margin-bottom:12px;}
.hist{border-left:3px solid var(--line); margin:10px 0 0 4px; padding-left:12px;}
.hist div{font-size:13px; padding:5px 0; border-bottom:1px dashed var(--line);}
.hist .t{color:var(--muted); font-size:11px;}
.empty{text-align:center; color:var(--muted); padding:34px 16px; font-size:14px; line-height:1.7;}
.empty .btn{margin-top:6px;}
.kv{display:flex; justify-content:space-between; gap:14px; font-size:14px; padding:9px 0; border-bottom:1px solid var(--line);}
.kv:last-child{border-bottom:none;}
.kv b{color:var(--navy); font-weight:700; text-align:right;}
table.props{width:100%; border-collapse:collapse; font-size:14px;}
table.props th{text-align:left; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.7px;
  color:var(--muted); padding:10px 6px; border-bottom:2px solid var(--navy);}
table.props td{padding:10px 6px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums;}
table.props tr:last-child td{border-bottom:none;}
.note{font-size:12px; color:var(--muted); line-height:1.5;}
h2.sec{font-size:12.5px; font-weight:800; color:var(--navy); margin:20px 0 12px;
  text-transform:uppercase; letter-spacing:1.4px;}
h2.sec::after{content:""; display:block; width:36px; height:2.5px; border-radius:2px;
  background:var(--gold); margin-top:6px;}
.idrow{display:flex; gap:8px; align-items:stretch;}
.idrow input,.idrow select{flex:1;}
.idrow .btn{width:auto; white-space:nowrap; margin:6px 0 12px;}
#scanwrap{background:#000; border-radius:12px; overflow:hidden; margin:6px 0 10px;}
#scanvideo{width:100%; max-height:320px; display:block; background:#000;}#scanwrap{position:relative;}.vfframe{position:absolute;left:17.5%;top:17.5%;width:65%;height:65%;border:3px solid rgba(255,255,255,.9);border-radius:10px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.28);}
#scanmsg{margin:8px 0;}
.toast{position:fixed; left:50%; bottom:104px; transform:translateX(-50%);
  background:linear-gradient(180deg,var(--navy2),var(--navy)); color:#fff;
  padding:12px 20px; border-radius:999px; font-size:14px; font-weight:700; z-index:99; display:none;
  max-width:90vw; text-align:center; border:1px solid rgba(201,169,106,.45);
  box-shadow:0 10px 28px rgba(11,28,51,.35);}
/* header.branded keeps default static positioning */
.req{color:var(--red); font-weight:800;}
.help ol{margin:10px 0 14px; padding-left:20px;}
.help li{margin:8px 0; font-size:14px; line-height:1.45;}
@media (min-width:900px){
  main{max-width:980px; padding:18px 16px;}
  .cards2{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start;}
  .cards2 .card{margin-bottom:0;}
  .tile{min-width:150px;}
  #bottomnav{max-width:980px; margin-left:auto; margin-right:auto;}
  .logos img{max-height:60px;}
}

.login-screen{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
  background:radial-gradient(120% 80% at 50% 20%, rgba(201,169,106,.16), transparent 55%),
  linear-gradient(150deg,var(--navy3) 0%,var(--navy) 55%,var(--navy2) 100%);}
.login-card{position:relative; background:#fff; border-radius:18px; padding:32px 26px 26px; width:100%; max-width:360px;
  box-shadow:0 28px 70px rgba(0,0,0,.4); border-top:4px solid var(--gold);
  animation:cardIn .35s cubic-bezier(.2,.9,.3,1.05);}
@keyframes cardIn{from{transform:translateY(24px) scale(.97); opacity:0;} to{transform:none; opacity:1;}}
.login-card h2{margin:0 0 6px; font-size:22px; font-weight:800; color:var(--navy); letter-spacing:1.5px; text-transform:uppercase;}
.login-card h2::after{content:""; display:block; width:44px; height:3px; border-radius:2px;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold)); margin-top:8px;}
.login-card .note{margin:10px 0 14px;}
.login-card .btn{margin-top:8px;}

/* ---------- print reports ---------- */
#print-area{display:none;}
@media print{
  @page{margin:0.6in;}
  html,body{background:#fff !important;}
  body{font-family:Georgia,'Times New Roman',serif; color:#000;}
  body>*:not(#print-area){display:none !important;}
  #print-area{display:block !important; color:#000;}
  .pr-head{border-bottom:2.5px solid #000; padding-bottom:10px; margin-bottom:14px;}
  .pr-title{font-size:17pt; font-weight:800; letter-spacing:1.5px;}
  .pr-sub{font-size:13pt; font-weight:700; margin-top:3px;}
  .pr-meta{font-size:9pt; color:#333; margin-top:5px;}
  .pr-sec{font-size:12pt; font-weight:800; margin:16px 0 6px; border-bottom:1px solid #666; padding-bottom:3px;}
  .pr-table{width:100%; border-collapse:collapse; margin:6px 0 10px; font-size:9.5pt;}
  .pr-table th{background:#e8e8e8 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;
    text-align:left; padding:6px 8px; border:1px solid #666; font-weight:800;}
  .pr-table td{padding:6px 8px; border:1px solid #666; vertical-align:top;}
  .pr-table thead{display:table-header-group;}
  .pr-table tr{page-break-inside:avoid;}
  .pr-kv{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px dotted #999; font-size:10.5pt; page-break-inside:avoid;}
  .pr-kv span{color:#333;}
  .pr-hist>div{padding:6px 0; border-bottom:1px dotted #999; font-size:10pt; page-break-inside:avoid;}
  .pr-hist .t{color:#555; font-size:8.5pt; margin-top:2px;}
  .pr-head,.pr-sec{page-break-after:avoid;}
}


.scanresult{text-align:center; padding:6px 2px;}
.scanresult .rname{font-size:32px; font-weight:800; color:var(--navy); margin:10px 0 4px; line-height:1.2;}
.scanresult .rhotel{font-size:20px; font-weight:800; color:var(--gold-deep); margin-bottom:12px;}
.scanbig{font-size:14px; color:var(--muted); margin:8px 0;}

</style>
</head>

<script>
"use strict";
/* ============ Loews Package Tracking ============ */
const PROPS = ["PBH","HRH","RPR","SFR","AVA","CBBR","ESS","ESD","SNR","TLR","HGH"];
const PROP_FULL = {PBH:"Loews Portofino Bay Hotel",HRH:"Hard Rock Hotel",RPR:"Loews Royal Pacific Resort",SFR:"Loews Sapphire Falls Resort",AVA:"Universal Aventura Hotel",CBBR:"Universal Cabana Bay Beach Resort",ESS:"Universal's Endless Summer Resort - Surfside",ESD:"Universal's Endless Summer Resort - Dockside",SNR:"Universal Stella Nova Resort",TLR:"Universal Terra Luna Resort",HGH:"Universal Helios Grand Hotel"};
const CARRIERS = ["Mail","USPS","UPS","FedEx","Amazon","DHL","Other"];
const PKG_STATUS = ["Logged","Picked up","Delivered"];
const LS_KEY = "loewsPackageTrackingV1";

/* === SUPABASE LIVE SYNC (auto-injected) === */
const SB_URL = 'https://qxqrwusaynfqadjfqswe.supabase.co';
const SB_KEY = 'sb_publishable_2ba9yzEA89uqXHJ6v-_cQg_AmwwEfFF';
const SB_APP = 'package';
const SB_ROW_ID = SB_APP + '-state';
let sbSyncTimer = null;
function sbBadge(online, syncing){
  var el = document.getElementById('sb-sync-badge');
  if(!el){
    el = document.createElement('div');
    el.id = 'sb-sync-badge';
    el.style.cssText = 'position:fixed;bottom:10px;right:10px;z-index:9999;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(0,0,0,0.65);color:#fff;pointer-events:none;font-family:system-ui,sans-serif;';
    document.body.appendChild(el);
  }
  el.textContent = syncing ? '⟳ Syncing…' : (online ? '● Live sync' : '○ Offline');
  el.style.color = syncing ? '#fbbf24' : (online ? '#4ade80' : '#f87171');
}
async function sbPush(){
  sbBadge(true, true);
  if(!S._ts){ S._ts = Date.now(); try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
  try{
    var payload = JSON.parse(JSON.stringify(S));
    if('session' in payload) payload.session = null;
    var res = await fetch(SB_URL + '/rest/v1/app_records', {
      method: 'POST',
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'},
      body: JSON.stringify({id: SB_ROW_ID, app: SB_APP, data: payload})
    });
    if(res.ok){
      var now = new Date().toISOString();
      try{ localStorage.setItem(LS_KEY + '-cloud-ts', now); }catch(e){}
      sbBadge(true, false);
    } else sbBadge(false, false);
  }catch(e){ sbBadge(false, false); }
}
function recCount(d){
  d = d || {};
  return (d.pkgs ? d.pkgs.length : 0) + (d.team ? d.team.length : 0) + (d.logins ? d.logins.length : 0);
}
async function sbPull(){
  try{
    var res = await fetch(SB_URL + '/rest/v1/app_records?id=eq.' + encodeURIComponent(SB_ROW_ID) + '&select=data', {
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}
    });
    if(!res.ok) return;
    var rows = await res.json();
    if(!rows || !rows.length){ if(recCount(S) > 0) sbPush(); return; }
    var cloud = rows[0].data || {};
    /* The database updated_at never changes on upsert, so sync order is
       decided by the _ts edit stamp carried inside the data itself. */
    var cloudTs = cloud._ts || 0, localTs = S._ts || 0;
    var takeCloud = function(){
      var keepSession = S.session;
      S = cloud;
      if(!Array.isArray(S.pkgs)) S.pkgs = [];
      if(!Array.isArray(S.team) || !S.team.length) S.team = DEFAULT_TEAM.slice();
      if(!Array.isArray(S.logins)) S.logins = [];
      if(!S.propNames) S.propNames = {};
      if(!S.seq) S.seq = 1;
      S.session = keepSession;
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      if(typeof render === 'function'){ try{ render(); }catch(e){} }
      sbBadge(true, false);
    };
    if(cloudTs === 0 && localTs === 0){
      /* Legacy data with no stamps: the side holding more records wins once,
         then its push stamps the cloud for everyone. */
      if(recCount(S) >= recCount(cloud)){
        if(recCount(S) > 0 || recCount(cloud) > 0) sbPush(); else sbBadge(true, false);
        return;
      }
      takeCloud(); sbPush(); return;
    }
    if(cloudTs > localTs){
      if(recCount(cloud) === 0 && recCount(S) > 0){ sbPush(); return; }
      /* A device that has never run the stamped sync (localTs 0) and holds
         MORE records than the cloud keeps its data — it becomes the source. */
      if(localTs === 0 && recCount(S) > recCount(cloud)){ sbPush(); return; }
      takeCloud(); return;
    }
    if(localTs > cloudTs){ sbPush(); return; }
    sbBadge(true, false);
  }catch(e){}
}
function sbSchedulePush(){
  if(sbSyncTimer) clearTimeout(sbSyncTimer);
  sbSyncTimer = setTimeout(sbPush, 2000);
}
setTimeout(sbPull, 2000);
setInterval(sbPull, 30000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) sbPull(); });
/* === END SUPABASE LIVE SYNC === */
const DEFAULT_TEAM = [{name:"Jeremy Levin",pin:"1245"},{name:"Alexander Duff",pin:"0132"},{name:"Dominique Black",pin:"2195"},{name:"Sean Forester",pin:"3867"},{name:"Justin Messger",pin:"5132"}];

let S = { pkgs:[], propNames:{}, seq:1, team:DEFAULT_TEAM.slice(), session:null, logins:[] };
let filter = "ALL", pkgSearch = "", tab = "dash";
let memOnly = false;

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && d.pkgs){ S = d;
      if(!Array.isArray(S.team)||!S.team.length) S.team = DEFAULT_TEAM.slice();
      if(!Array.isArray(S.logins)) S.logins = [];
      if(!S.propNames) S.propNames = {};
      if(!S.seq) S.seq = 1;
    } }
  }catch(e){ memOnly = true; }
}
function sessionName(){ return (S.session&&S.session.name)||""; }
function logHist(p,e){ p.hist=p.hist||[]; p.hist.push({t:nowLocal(),e:e,by:sessionName()}); }
function save(){
  S._ts = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); memOnly = false; }
  catch(e){ memOnly = true; }

  if(typeof sbSchedulePush === "function") sbSchedulePush();
}
function uid(p){ return p + "-" + (S.seq++) + "-" + Date.now().toString(36); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowLocal(){ const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes()); }
function fmtDT(s){ if(!s) return "—"; const d=new Date(s); return isNaN(d)?esc(s):d.toLocaleString(); }
function fmtD(s){ if(!s) return "—"; const d=new Date(s+"T12:00:00"); return isNaN(d)?esc(s):d.toLocaleDateString(); }
function propLabel(c){ return c+" · "+propName(c); }
function propName(c){ return (S.propNames&&S.propNames[c])||PROP_FULL[c]||c; }
function inFilter(p){ return filter==="ALL" || p===filter; }

function statusBadge(st){
  const m={"Logged":"b-blue","Picked up":"b-green","Delivered":"b-green"};
  return '<span class="badge '+(m[st]||"b-gray")+'">'+esc(st)+"</span>";
}

/* ---------- modal ---------- */
const modal = document.getElementById("modal"), sheet = document.getElementById("sheet");
function openSheet(html){ sheet.innerHTML = html; modal.classList.add("open"); sheet.scrollTop=0; }
function closeSheet(){ try{ stopScanTracks(); }catch(e){} modal.classList.remove("open"); }
modal.addEventListener("click", e=>{ if(e.target===modal) closeSheet(); });

/* ---------- property bar ---------- */
function renderPropbar(){
  let h = '<button class="chip'+(filter==="ALL"?" active":"")+'" onclick="setFilter(\'ALL\')">ALL</button>';
  PROPS.forEach(c=>{ h += '<button class="chip'+(filter===c?" active":"")+'" onclick="setFilter(\''+c+'\')" title="'+c+'">'+esc(propName(c))+"</button>"; });
  document.getElementById("propbar").innerHTML = h;
}
window.setFilter = c=>{ filter=c; renderPropbar(); render(); };

/* ---------- tabs ---------- */
document.getElementById("bottomnav").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  try{ stopScanTracks(); }catch(err){}
  tab = b.dataset.tab;
  document.querySelectorAll("#bottomnav button").forEach(x=>x.classList.toggle("active", x===b));
  document.querySelectorAll("section.tab").forEach(s=>s.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");
  render();
});

/* ---------- dashboard ---------- */
function renderDash(){
  const pkgs = S.pkgs.filter(p=>inFilter(p.prop));
  const today = todayISO();
  const nToday = pkgs.filter(p=>p.date===today).length;
  const nAwait = pkgs.filter(p=>p.status==="Logged").length;
  const nPicked = pkgs.filter(p=>p.status==="Picked up").length;
  const nDelivered = pkgs.filter(p=>p.status==="Delivered").length;
  let h = '<div class="toolbar"><button class="btn btn-ghost btn-sm" onclick="printDailyLog()">Print daily log</button></div>'
    +'<h2 class="sec" style="margin-top:2px">Today at a glance</h2><div class="row">'
    +'<div class="tile"><div class="n">'+nToday+'</div><div class="l">Today\'s packages</div></div>'
    +'<div class="tile'+(nAwait?' warn':'')+'"><div class="n">'+nAwait+'</div><div class="l">Awaiting pickup</div></div>'
    +'<div class="tile"><div class="n">'+nPicked+'</div><div class="l">Picked up</div></div>'
    +'<div class="tile"><div class="n">'+nDelivered+'</div><div class="l">Delivered</div></div>'
    +"</div>";
  h += '<div class="card"><h3>By hotel</h3><table class="props"><tr><th>Hotel</th><th>Packages</th><th>Awaiting</th></tr>';
  PROPS.forEach(c=>{
    const pp=S.pkgs.filter(p=>p.prop===c);
    h += "<tr><td><b>"+esc(propName(c))+'</b> <span class="note">'+esc(c)+"</span></td>"
      +"<td>"+pp.length+"</td><td>"+pp.filter(p=>p.status==="Logged").length+"</td></tr>";
  });
  h += "</table></div>";
  const recent=[];
  S.pkgs.forEach(p=>(p.hist||[]).forEach(ev=>recent.push({t:ev.t, e:"Package "+(p.tracking||"")+" ("+(p.recipient||"")+"): "+ev.e})));
  recent.sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  h += '<div class="card"><h3>Recent activity</h3>';
  if(!recent.length) h += '<div class="empty">Nothing logged yet.</div>';
  else { h += '<div class="hist">'; recent.slice(0,10).forEach(r=>{
    h += "<div>"+esc(r.e)+'<div class="t">'+fmtDT(r.t)+"</div></div>"; }); h += "</div>"; }
  h += "</div>";
  if(!S.helpSeen) h = '<div class="card help"><h3>Welcome — how this works</h3><ol>'
    +'<li><b>Scan tab:</b> point the camera at a package barcode — the app shows who it is for and which hotel, nice and big.</li>'

    +'<button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>');

let sigCtx=null, sigDrawing=false, sigEmpty=true;
function sigInit(){
  const cv=document.getElementById("sigcanvas"); if(!cv) return;
  sigCtx=cv.getContext("2d"); sigDrawing=false; sigEmpty=true;
  sigCtx.lineWidth=3; sigCtx.lineCap="round"; sigCtx.lineJoin="round"; sigCtx.strokeStyle="#000";
  const pos=e=>{
    const r=cv.getBoundingClientRect();
    const t=(e.touches&&e.touches[0])||e;
    return [(t.clientX-r.left)*cv.width/Math.max(1,r.width),(t.clientY-r.top)*cv.height/Math.max(1,r.height)];
  };
  const start=e=>{ e.preventDefault(); sigDrawing=true; sigEmpty=false; const xy=pos(e); sigCtx.beginPath(); sigCtx.moveTo(xy[0],xy[1]); };
  const move=e=>{ if(!sigDrawing) return; e.preventDefault(); const xy=pos(e); sigCtx.lineTo(xy[0],xy[1]); sigCtx.stroke(); };
  const end=()=>{ sigDrawing=false; };
  cv.addEventListener("mousedown",start);
  cv.addEventListener("mousemove",move);
  window.addEventListener("mouseup",end);
  cv.addEventListener("touchstart",start,{passive:false});
  cv.addEventListener("touchmove",move,{passive:false});
  cv.addEventListener("touchend",end);
}
window.sigClear=()=>{ const cv=document.getElementById("sigcanvas"); if(cv&&sigCtx){ sigCtx.clearRect(0,0,cv.width,cv.height); sigEmpty=true; } };
window.sigSave=(u,mode,fromScan)=>{
  const p=S.pkgs.find(x=>x.uid===u); if(!p) return;
  const nv=document.getElementById("sig-name");
  const name=nv?nv.value.trim():"";
  if(!name){ alert("Enter a name."); return; }
  const cv=document.getElementById("sigcanvas");
  p.signature=(!sigEmpty&&cv)?cv.toDataURL("image/png"):"";
  if(mode==="delivered"){ p.status="Delivered"; p.deliveredBy=name; p.deliveredAt=nowLocal(); logHist(p,"Delivered to "+name); }
  else { p.status="Picked up"; p.pickedBy=name; p.pickedAt=nowLocal(); logHist(p,"Picked up by "+name); }
  save(); render();
  if(fromScan){ handleScanLookup(p.tracking); } else { pkgDetail(u); }
  toast(mode==="delivered"?"Marked delivered":"Marked picked up");
};
window.markPickedUp = (u,fromScan)=>{ sigPad(u,"pickup",!!fromScan); };
window.markDelivered = (u,fromScan)=>{ sigPad(u,"delivered",!!fromScan); };
window.delPkg = u=>{

  S.pkgs=S.pkgs.filter(x=>x.uid!==u); save(); closeSheet(); render(); toast("Package deleted");
};

/* ---------- barcode scanner (Scan tab + form Scan button) ---------- */
let scanStream=null, scanRAF=null, scanDetector=null, scanning=false, scanMode=null, scanTarget=null, scanDraft=null, lastScanCode="";
let quaggaRunning=false;
function quaggaDetected(d){
  const c=d&&d.codeResult&&d.codeResult.code;
  if(c){ stopScanTracks(); onScanResult(String(c).trim()); }
}
function stopScanTracks(){
  scanning=false; fallbackLive=false;
  clearTimeout(nudgeT); blackN=0; blackHintShown=false;
  document.querySelectorAll("#scanstat").forEach(el=>{ el.textContent=""; });
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  try{ if(typeof Quagga!=="undefined"){ Quagga.offDetected(quaggaDetected); if(quaggaRunning){ Quagga.stop(); } } }catch(e){}
  quaggaRunning=false;
  document.querySelectorAll("#scanvideo").forEach(v=>{ v.style.display=""; try{ v.pause(); }catch(e){} v.srcObject=null; });
  document.querySelectorAll("#scanwrap").forEach(w=>{ w.querySelectorAll("canvas").forEach(n=>n.remove()); });
  document.querySelectorAll("#scanstartbtn").forEach(b=>{ b.textContent="Start scanning"; });
}
function makeDetector(){
  try{ return new BarcodeDetector({formats:["code_128","qr_code","ean_13","upc_a","code_39","itf"]}); }
  catch(e){ try{ return new BarcodeDetector(); }catch(e2){ return null; } }
}
function renderScan(){
  const supported = ("BarcodeDetector" in window);
  let h = '<h2 class="sec" style="margin-top:2px">Scan barcode</h2>'
    +'<div class="card"><div id="scanwrap"><video id="scanvideo" playsinline muted></video><div class="vfframe"></div></div><div id="scanstat" class="note" style="margin-top:4px;font-size:12px;color:#8a8f98"></div>'
    +'<canvas id="scancv" style="display:none"></canvas>'
    +'<div id="scanmsg" class="note">Tap Start to open the rear camera, then point it at the package barcode.</div>'
    +'<button class="btn btn-primary" id="scanstartbtn" onclick="toggleScan()">Start scanning</button>'
    +'<button class="btn btn-gold" style="margin-top:8px" onclick="document.getElementById(\'scanphoto\').click()">Take photo of barcode</button>'
    +'<input type="file" id="scanphoto" accept="image/*" capture="environment" style="display:none" onchange="scanPhoto(this)">'
    +'<button class="btn btn-primary" style="margin-top:8px" onclick="document.getElementById(\'scanlabel\').click()">Scan full label \u2014 fills everything</button>'
    +'<input type="file" id="scanlabel" accept="image/*" capture="environment" style="display:none" onchange="scanFullLabel(this)">'
    +'<div id="scanmsg2" class="note" style="margin-top:6px"></div>';
  if(!supported){
    h += '<p class="note" style="margin-top:10px">This browser has no built-in barcode reader, so the app will use its backup scanner — live scan, photo, or manual entry all work.</p>';
  }
  h += '<label style="margin-top:14px">Or enter tracking # manually</label>'
    +'<div class="idrow"><input type="text" id="scanmanual" placeholder="Tracking number"><button class="btn btn-gold btn-sm" onclick="useManualScan()">Look up</button></div>'

    +'</div><div id="scanresult"></div>';

window.toggleScan = ()=>{
  if(scanning){ stopScanTracks(); const m=document.getElementById("scanmsg"); if(m) m.textContent="Scanner stopped."; return; }
  scanMode="tab";
  if("BarcodeDetector" in window){ startScanCamera(); return; }
  startFallbackLive();
};
let fallbackLive=false, lastDecT=0, nudgeT=null, blackN=0, blackHintShown=false, scanTries=0, scanStartT=0, noFrameWarned=false;
function scanBox(){
  const sh=document.getElementById("sheet"), mo=document.getElementById("modal");
  if(sh&&mo&&mo.classList.contains("open")&&sh.querySelector("#scanwrap")) return sh;
  return document;
}
function startFallbackLive(){
  const box=scanBox();
  const msg=box.querySelector("#scanmsg");
  const btn=box.querySelector("#scanstartbtn");
  if(typeof Quagga==="undefined"){ if(msg) msg.textContent="Scanner still loading — use the photo option below."; return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ if(msg) msg.innerHTML="Live camera unavailable here. Use <b>Take photo of barcode</b> below — it works everywhere."; return; }
  const v=box.querySelector("#scanvideo");
  if(!v){ if(msg) msg.textContent="Scanner unavailable."; return; }
  if(msg) msg.textContent="Starting camera…";
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment", width:{ideal:1280}, height:{ideal:720}, focusMode:{ideal:"continuous"}}}).then(st=>{
    scanStream=st;
    v.style.display="";
    try{ v.muted=true; v.setAttribute("playsinline",""); v.setAttribute("autoplay",""); }catch(e){}
    v.srcObject=st;
    let pr=null; try{ pr=v.play(); }catch(e){}
    const go=()=>{
      scanning=true; fallbackLive=true; lastDecT=0; blackN=0; blackHintShown=false; scanTries=0; scanStartT=Date.now(); noFrameWarned=false;
      if(btn) btn.textContent="Stop";
      if(msg) msg.textContent="Point at the barcode — fill the white box and hold steady…";
      clearTimeout(nudgeT);
      nudgeT=setTimeout(()=>{ if(scanning&&fallbackLive){ const m2=scanBox().querySelector("#scanmsg"); if(m2) m2.innerHTML="No barcode yet — hold steady and fill the frame, or use <b>Take photo of barcode</b> below."; } },12000);
      fallbackTick();
    };
    if(pr&&pr.then){ pr.then(go).catch(go); } else { go(); }
  }).catch(()=>{ if(msg) msg.innerHTML="Live camera unavailable here. Use <b>Take photo of barcode</b> below — it works everywhere."; stopScanTracks(); });
}
function qDecode(urls, done){
  const u=urls.shift();
  if(!u){ done(null); return; }
  try{
    Quagga.decodeSingle({src:u, numOfWorkers:0,
      decoder:{readers:["code_128_reader","ean_reader","upc_reader","upc_e_reader","code_39_reader","i2of5_reader"]},
      locate:true, locator:{patchSize:"medium"}},
      res=>{ const c=res&&res.codeResult&&res.codeResult.code; if(c){ done(c); } else { qDecode(urls, done); } });
  }catch(e){ qDecode(urls, done); }
}
function fallbackTick(){
  if(!scanning||!fallbackLive) return;
  const box=scanBox();
  const v=box.querySelector("#scanvideo");
  const cv=document.getElementById("scancv");
  const now=Date.now();
  const stat=box.querySelector("#scanstat");
  if(v&&stat){
    stat.textContent="cam "+v.videoWidth+"x"+v.videoHeight+" rs"+v.readyState+" • tries "+scanTries;
    if(!noFrameWarned&&now-scanStartT>6000&&(v.videoWidth===0||v.readyState<2)){
      noFrameWarned=true;
      const m2=box.querySelector("#scanmsg");
      if(m2) m2.innerHTML="Camera isn't sending frames the app can read — tap <b>Take photo of barcode</b> above, it uses your real camera app.";
    }
  }
  if(v&&cv&&v.readyState>=2&&v.videoWidth>0&&(now-lastDecT)>900){
    scanTries++;
    lastDecT=now;
    const w=960, h=Math.max(1,Math.round(960*v.videoHeight/v.videoWidth));
    cv.width=w; cv.height=h;
    try{
      const ctx=cv.getContext("2d"); ctx.drawImage(v,0,0,w,h);
      try{
        const d=ctx.getImageData(0,0,w,h).data;
        let s1=0,s2=0,n=0;
        for(let i=0;i<d.length;i+=400){ const b=d[i]; s1+=b; s2+=b*b; n++; }
        const mu=s1/n, va=s2/n-mu*mu;
        if(va<25){ blackN++; } else { blackN=0; }
        if(blackN>=6 && !blackHintShown){
          blackHintShown=true;
          const m2=scanBox().querySelector("#scanmsg");
          if(m2) m2.innerHTML="Camera preview is blank in this browser — tap <b>Take photo of barcode</b> above instead, it works every time.";
        }
      }catch(e){}
    }catch(e){}
    try{
      const cw=Math.round(w*0.65), ch=Math.round(h*0.65);
      const cc=document.createElement("canvas"); cc.width=cw; cc.height=ch;
      cc.getContext("2d").drawImage(cv,Math.round((w-cw)/2),Math.round((h-ch)/2),cw,ch,0,0,cw,ch);
      qDecode([cc.toDataURL("image/jpeg",0.92), cv.toDataURL("image/jpeg",0.85)],
        code=>{ if(code&&scanning){ onScanResult(String(code).trim()); } });
    }catch(e){}
  }
  scanRAF=requestAnimationFrame(fallbackTick);
}
window.useManualScan = ()=>{
  const v=document.getElementById("scanmanual").value.trim();
  if(!v){ alert("Type the tracking number first."); return; }
  stopScanTracks(); handleScanLookup(v);
};
function startScanCamera(){
  const msg=document.getElementById("scanmsg");
  scanDetector=makeDetector();
  if(!scanDetector){ if(msg) msg.textContent="Scanner unavailable in this browser."; return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ if(msg) msg.textContent="Camera not available here."; return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(st=>{
    scanStream=st; const v=document.getElementById("scanvideo");
    if(!v){ stopScanTracks(); return; }
    v.srcObject=st; v.play(); scanning=true;
    const b=document.getElementById("scanstartbtn"); if(b) b.textContent="Stop";
    if(msg) msg.textContent="Point at the barcode — fill the white box and hold steady…";
    scanTick();
  }).catch(()=>{ const m=document.getElementById("scanmsg"); if(m) m.innerHTML="Camera blocked or unavailable. If you opened this link inside another app, open it directly in Safari or Edge and allow camera access, or use the photo option below."; });
}
function scanTick(){
  if(!scanning) return;
  const v=document.getElementById("scanvideo");
  const run=()=>{ scanRAF=requestAnimationFrame(scanTick); };
  if(v&&v.readyState===v.HAVE_ENOUGH_DATA&&scanDetector){
    scanDetector.detect(v).then(res=>{
      if(!scanning) return;
      if(res&&res.length&&res[0].rawValue){ onScanResult(String(res[0].rawValue).trim()); return; }
      run();
    }).catch(run);
  } else run();
}
function parseBarcode(raw){
  const s=String(raw||"");
  const segs=s.split(/[\x00-\x1f\x7f]/).map(x=>x.toUpperCase().replace(/[^A-Z0-9]/g,"")).filter(x=>x.length>=4);
  segs.push(s.toUpperCase().replace(/[^A-Z0-9]/g,""));
  const runs=[];
  segs.forEach(x=>{ const m=x.match(/1Z[0-9A-Z]{16}|\d{8,}/g); if(m) m.forEach(r=>runs.push(r)); });
  let pick=runs.find(r=>/^9\d{19,21}$/.test(r));
  if(!pick) pick=runs.find(r=>/^1Z[0-9A-Z]{16}$/.test(r));
  if(!pick) pick=runs.find(r=>/^\d{12,15}$/.test(r));
  if(!pick&&runs.length) pick=runs.slice().sort((a,b)=>b.length-a.length)[0];
  return pick||s.toUpperCase().replace(/[^A-Z0-9]/g,"");
}
function normTrack(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function handleScanLookup(code){
  code=parseBarcode(code);
  lastScanCode=code;
  const el=document.getElementById("scanresult"); if(!el) return;
  const p=S.pkgs.find(x=>normTrack(x.tracking)===normTrack(code));
  if(p){
    el.innerHTML='<div class="card scanresult">'
      +'<div class="scanbig">Package found — deliver to:</div>'
      +'<div class="rname">'+esc(p.recipient)+"</div>"

function quaggaPhoto(cv, done, msg2){
  try{
    const w=cv.width, h=cv.height, cw=Math.round(w*0.65), ch=Math.round(h*0.65);
    const cc=document.createElement("canvas"); cc.width=cw; cc.height=ch;
    cc.getContext("2d").drawImage(cv,Math.round((w-cw)/2),Math.round((h-ch)/2),cw,ch,0,0,cw,ch);
    qDecode([cc.toDataURL("image/jpeg",0.92), cv.toDataURL("image/jpeg",0.9)], code=>{ done(code||null); });
  }catch(e){ if(msg2) msg2.textContent="Couldn't read a barcode from that photo — try again, or type the number."; }
}
function loadTesseract(cb){
  if(window.Tesseract) return cb(null);
  const cdns=[
    "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",
    "https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js"
  ];
  let i=0;
  const next=()=>{
    if(i>=cdns.length) return cb(new Error("ocr-unavailable"));
    const sc=document.createElement("script");
    sc.src=cdns[i++];
    sc.onload=()=>cb(null);
    sc.onerror=()=>next();
    document.head.appendChild(sc);
  };
  next();
}
function dedupeRepeat(sp){
  const m=sp.match(/^(.+?)\s*[-\u2013]\s*\1$/);
  if(m) return m[1].trim();
  const w=sp.split(/\s+/).filter(Boolean);
  if(w.length>=4&&w.length%2===0){
    const h=w.length/2, a=w.slice(0,h).join(" "), b=w.slice(h).join(" ");
    const na=a.replace(/[^A-Z0-9]/gi,""), nb=b.replace(/[^A-Z0-9]/gi,"");
    if(na===nb&&na.length>0) return a;
  }
  return sp;
}
function cleanLine(l){
  return l.replace(/\s*:?\s*RDC\s*\d+\s*:?/gi," ").replace(/\s+/g," ").trim();
}
function parseLabelText(text){
  const out={track:"", carrier:"", recip:"", sender:""};
  const T=String(text||"");
  const U=T.toUpperCase();
  if(/USPS|U\.S\. POSTAGE|POSTAGE PAID/.test(U)) out.carrier="USPS";
  else if(/FEDEX/.test(U)) out.carrier="FedEx";
  else if(/\bUPS\b/.test(U)) out.carrier="UPS";
  else if(/\bDHL\b/.test(U)) out.carrier="DHL";
  else if(/AMAZON/.test(U)) out.carrier="Amazon";
  const tm=T.match(/\b(\d[\d ]{18,}\d)\b/);
  if(tm){ const d=tm[1].replace(/\D/g,""); if(/^9\d{19,21}$/.test(d)) out.track=d; }
  if(!out.track){
    const tm2=T.match(/\b(\d{12,15})\b/);
    if(tm2) out.track=tm2[1];
  }
  const lines=T.split("\n").map(l=>l.replace(/\s+/g," ").trim()).filter(l=>l.length>1);
  const up=lines.map(l=>l.toUpperCase());
  let si=-1;
  const streetRe=/\b\d{2,}\s+[A-Z0-9 .'-]{2,}\b(BLVD|BOULEVARD|AVE|AVENUE|ST|STREET|DR|DRIVE|RD|ROAD|LN|LANE|WAY|CT|COURT|PL|PLACE|TER|TERRACE|PKWY|PARKWAY)\b/;
  for(let i=0;i<lines.length;i++){
    if(/TRACKING\s*#|TRACKING NUMBER/.test(up[i])) break;
    if(streetRe.test(up[i])) si=i;
  }
  if(si>0){
    const stop=/USPS|POSTAGE|MAILED FROM|CREATED\s+\d|RDC\s*\d|GROUND ADVANTAGE|PRIORITY MAIL|FIRST-CLASS|FIRST CLASS|PARCEL SELECT|EXPRESS MAIL/;
    const rl=[];
    for(let i=si-1;i>=0&&rl.length<3;i--){
      if(/^[A-Z .'-]+\s+[A-Z]{2}\s+\d{5}(-\d{4})?$/.test(up[i])&&rl.length>0) break;
      if(stop.test(up[i])&&!/GUEST|ATTN/.test(up[i])) break;
      rl.unshift(lines[i]);
    }
    if(rl.length){
      let nm=rl.join(" ").replace(/\s*\(GUEST\b/gi," ").split("(")[0];
      nm=nm.replace(/^(TO|SHIP TO|ATTN|ATTENTION)[:\s]+/i,"").replace(/\s+ATTN\s+.*$/i,"");
      nm=dedupeRepeat(nm.replace(/\s+/g," ").trim());
      out.recip=nm.replace(/^[\s,-]+|[\s,-]+$/g,"").trim();
    }
    const ri=si-rl.length, sl=[];
    for(let i=ri-1;i>=0&&sl.length<2;i--){
      const cl=cleanLine(lines[i]);
      if(!/\d/.test(cl)) continue;
      if(/CREATED|MAILED FROM|POSTAGE|USPS|TRACKING/.test(up[i])) continue;
      if((cl.match(/[=\[\]{}&$#@*~^|<>]/g)||[]).length>=2) continue;
      const alpha=(cl.replace(/[^A-Z0-9]/gi,"").length)/(cl.length||1);
      if(alpha<0.55) continue;
      sl.unshift(cl);
    }
    out.sender=sl.join(", ").trim();
  } else {
    const gi=up.findIndex(l=>/GUEST/.test(l));
    if(gi>=0) out.recip=dedupeRepeat(lines[gi].split("(")[0].trim());
  }
  return out;
}
window.scanFullLabel=(input)=>{
  const f=input.files&&input.files[0]; if(!f) return;
  const msg2=document.getElementById("scanmsg2");
  const setM=t=>{ if(msg2) msg2.textContent=t; };
  setM("Reading label\u2026");
  const url=URL.createObjectURL(f); const img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const maxW=1600; let w=img.naturalWidth,h=img.naturalHeight; const sc=Math.min(1,maxW/Math.max(w,h));
    const cv=document.createElement("canvas"); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    const dataUrl=cv.toDataURL("image/jpeg",0.9);
    const cw=Math.round(cv.width*0.65), ch=Math.round(cv.height*0.65);
    const cc=document.createElement("canvas"); cc.width=cw; cc.height=ch;
    cc.getContext("2d").drawImage(cv,Math.round((cv.width-cw)/2),Math.round((cv.height-ch)/2),cw,ch,0,0,cw,ch);
    const finish=(track,carrier,recip,sender)=>{
      input.value=""; setM("");
      if(!track&&!recip){ setM("Couldn't read the label \u2014 try again with the whole label in frame."); return; }
      addPkgForm({track:track, carrier:carrier||undefined, recip:recip, sender:sender});
      toast("Label scanned \u2014 check the fields and save");
    };
    qDecode([cc.toDataURL("image/jpeg",0.92), dataUrl], code=>{
      const track=code?parseBarcode(code):"";
      loadTesseract(err=>{
        if(err||!window.Tesseract){ finish(track,"","",""); return; }
        setM("Reading text\u2026");
        try{
          Tesseract.recognize(dataUrl,"eng",{logger:m=>{ if(m&&m.status==="recognizing text"&&msg2) setM("Reading text\u2026 "+Math.round((m.progress||0)*100)+"%"); }})
          .then(r=>{
            const pl=parseLabelText((r&&r.data&&r.data.text)||"");
            finish(track||pl.track||"", pl.carrier||"", pl.recip||"", pl.sender||"");
          })
          .catch(()=>finish(track,"","",""));
        }catch(e){ finish(track,"","",""); }
      });
    });
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); input.value=""; setM("Couldn't load that photo."); };
  img.src=url;
};
window.scanPhoto = (input)=>{
  const msg2=document.getElementById("scanmsg2");
  const f=input.files&&input.files[0]; if(!f) return;
  if(msg2) msg2.textContent="Reading barcode…";
  const useBD = ("BarcodeDetector" in window);
  const det = useBD ? makeDetector() : null;
  const hasQ = (typeof Quagga!=="undefined");
  if(!det && !hasQ){ if(msg2) msg2.textContent="Barcode reading not supported in this browser — type the tracking # instead."; input.value=""; return; }
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(url);
    // downscale huge photos for speed
    const maxW=1600; let w=img.naturalWidth, h=img.naturalHeight;
    const sc=Math.min(1, maxW/Math.max(w,h));
    const cv=document.createElement("canvas"); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    const done=(code)=>{
      input.value="";
      if(code){ if(msg2) msg2.textContent=""; handleScanLookup(String(code).trim()); }
      else if(msg2) msg2.textContent="Couldn't read a barcode from that photo — try again closer, or type the number.";
    };
    if(det){
      det.detect(cv).then(res=>{ done(res&&res.length&&res[0].rawValue?res[0].rawValue:null); })
        .catch(()=>{ quaggaPhoto(cv,done,msg2); });
    } else {
      quaggaPhoto(cv,done,msg2);
    }
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); input.value=""; if(msg2) msg2.textContent="Couldn't load that photo."; };
  img.src=url;
};

window.mergeBackup = inp=>{
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(!d||!Array.isArray(d.pkgs)){ alert("That file doesn't look like a package-tracking backup."); return; }
    const norm=t=>String(t||"").trim().toUpperCase();
    const lastAct=p=>{
      let m=String(p.created||"");
      (p.hist||[]).forEach(e=>{ const t=String(e.t||""); if(t>m) m=t; });
      ["pickedAt","deliveredAt"].forEach(k=>{ const t=String(p[k]||""); if(t&&t>m) m=t; });
      return m;
    };
    let added=0, updated=0;
    (d.pkgs||[]).forEach(bp=>{
      const tn=norm(bp.tracking); if(!tn) return;
      const ex=S.pkgs.find(p=>norm(p.tracking)===tn);
      if(!ex){ S.pkgs.push(bp); added++; return; }
      const newer = lastAct(bp)>=lastAct(ex) ? bp : ex;
      const older = newer===bp ? ex : bp;
      const seen={}, mh=[];
      (newer.hist||[]).concat(older.hist||[]).forEach(e=>{
        const k=String(e.t||"")+"|"+String(e.e||"")+"|"+String(e.by||"");
        if(!seen[k]){ seen[k]=1; mh.push(e); }
      });
      const merged=Object.assign({}, older, newer, {hist:mh, uid:ex.uid});
      S.pkgs[S.pkgs.indexOf(ex)]=merged; updated++;
    });
    const lseen={}; (S.logins||[]).forEach(e=>{ lseen[e.name+"|"+e.t]=1; });
    (d.logins||[]).forEach(e=>{ const k=e.name+"|"+e.t; if(!lseen[k]){ lseen[k]=1; S.logins.push(e); } });
    const tseen={}; (S.team||[]).forEach(m=>{ tseen[String(m.name||"").toLowerCase()]=1; });
    (d.team||[]).forEach(m=>{ const k=String(m.name||"").toLowerCase(); if(k&&!tseen[k]){ tseen[k]=1; S.team.push(m); } });
    S.propNames=S.propNames||{};
    Object.keys(d.propNames||{}).forEach(k=>{ if(!S.propNames[k]) S.propNames[k]=d.propNames[k]; });
    if(d.seq&&(S.seq||0)<d.seq) S.seq=d.seq;
    save(); renderPropbar(); render();
    toast("Merged: "+added+" added, "+updated+" updated");
  }catch(e){ alert("Could not read backup: "+e.message); } inp.value=""; };
  r.readAsText(f);
};

/* ---------- team login ---------- */
function renderLoginUsers(){
  document.getElementById("login-user").innerHTML=S.team.map(t=>'<option>'+esc(t.name)+"</option>").join("");
}
function gateLogin(){
  const lg=document.getElementById("login");
  if(S.session&&S.session.name){ lg.style.display="none"; }
  else{ document.getElementById("login-pin").value=""; document.getElementById("login-err").textContent="";
    renderLoginUsers(); lg.style.display="flex"; }
}
window.doLogin=()=>{
  const name=document.getElementById("login-user").value;
  const pin=document.getElementById("login-pin").value.trim();
  if(!S.team.some(t=>t.name===name&&t.pin===pin)){
    document.getElementById("login-err").textContent="Wrong PIN — try again."; return; }
  S.session={name:name};
  S.logins=S.logins||[]; S.logins.push({name:name,t:nowLocal()});
  if(S.logins.length>200) S.logins=S.logins.slice(-200);
  save();
  document.getElementById("login").style.display="none";
  render(); toast("Welcome, "+name);
};
window.logout=()=>{ S.session=null; save(); gateLogin(); };
window.addTeam=()=>{
  if(!(S.session && (S.session.name==="Jeremy Levin" || S.session.name==="Justin Messger"))){ toast("Only Jeremy or Justin can add team members"); return; }
  const name=document.getElementById("tm-name").value.trim();
  const pin=document.getElementById("tm-pin").value.trim();
  if(!name){ toast("Enter a name"); return; }
  if(!/^\d{4}$/.test(pin)){ toast("PIN must be 4 digits"); return; }
  if(S.team.some(t=>t.name.toLowerCase()===name.toLowerCase())){ toast("That name is already added"); return; }
  S.team.push({name:name,pin:pin}); save(); render(); toast(name+" added");
};
window.delTeam=i=>{
  if(!(S.session && (S.session.name==="Jeremy Levin" || S.session.name==="Justin Messger"))){ toast("Only Jeremy or Justin can remove team members"); return; }
  const t=S.team[i]; if(!t) return;
  if(S.session&&S.session.name===t.name){ toast("Can't remove the logged-in user"); return; }
  S.team.splice(i,1); save(); render(); toast(t.name+" removed");
};

/* ---------- printing ---------- */
function prHead(title){
  const when = new Date().toLocaleString();
  const filt = filter==="ALL" ? "All locations" : propLabel(filter);
  const by = sessionName();
  return '<div class="pr-head"><div class="pr-title">LOEWS PACKAGE TRACKING</div>'
    +'<div class="pr-sub">'+esc(title)+'</div>'
    +'<div class="pr-meta">Printed '+esc(when)+(by?' &middot; Prepared by '+esc(by):'')+' &middot; '+esc(filt)+'</div></div>';
}
function doPrint(title, body){
  document.getElementById("print-area").innerHTML = prHead(title) + body;
  window.print();
}
function standaloneReport(title, bodyHtml){
  const css="body{font-family:Georgia,'Times New Roman',serif;color:#000;margin:0.6in;}"
    +".pr-head{border-bottom:2.5px solid #000;padding-bottom:10px;margin-bottom:14px;}"
    +".pr-title{font-size:17pt;font-weight:800;letter-spacing:1.5px;}"
    +".pr-sub{font-size:13pt;font-weight:700;margin-top:3px;}"
    +".pr-meta{font-size:9pt;color:#333;margin-top:5px;}"
    +".pr-table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:9.5pt;}"
    +".pr-table th{background:#e8e8e8;text-align:left;padding:6px 8px;border:1px solid #666;font-weight:800;}"
    +".pr-table td{padding:6px 8px;border:1px solid #666;vertical-align:top;}"
    +".pr-table thead{display:table-header-group;}.pr-table tr{page-break-inside:avoid;}"
    +"@media print{.pr-table th{background:#e8e8e8 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}}";
  return "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">"
    +"<title>"+esc(title)+" \u2014 Loews Package Tracking</title><style>"+css+"</style></head><body>"
    +bodyHtml+"</body></html>";
}
function downloadReport(filename, html){
  try{
    const blob=new Blob([html],{type:"text/html"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{URL.revokeObjectURL(a.href);}catch(e){} a.remove(); },5000);
    return true;
  }catch(e){ return false; }
}
function prTable(heads, rows){
  let h = '<table class="pr-table"><thead><tr>';
  heads.forEach(x=>{ h += '<th>'+esc(x)+'</th>'; });
  h += '</tr></thead><tbody>';
  rows.forEach(r=>{ h += '<tr>'; r.forEach(c=>{ h += '<td>'+c+'</td>'; }); h += '</tr>'; });
  return h + '</tbody></table>';
}
window.printDailyLog = ()=>{
  const list = S.pkgs.filter(p=>inFilter(p.prop))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.created).localeCompare(String(a.created)));
  const rows = list.map(p=>['<b>'+esc(p.tracking||"—")+'</b>', fmtD(p.date), esc(p.loc||"LKWD"),
    esc(p.carrier||"—"), esc(p.sender||"—"), String(p.pkgNum||1), '<b>'+esc(p.recipient||"—")+'</b>',
    esc(propName(p.prop)), esc(p.status), esc(p.pickedBy||p.deliveredBy||"—")+(p.signature?'<br><img src="'+p.signature+'" style="width:110px;max-height:42px;border:1px solid #999;background:#fff">':""),
    (p.pickedAt||p.deliveredAt)?fmtDT(p.pickedAt||p.deliveredAt):"—", esc(p.notes||"")]);
  const body = list.length ? prTable(["Tracking #","Date","Loc.","Carrier","Sender","PKG #","Recipient's Name","Hotel","Status","Picked Up / Delivered By","Date/Time","Notes"], rows)
                : '<p>No packages logged.</p>';
  if(/iPad|iPhone|iPod/.test(navigator.userAgent||"")){
    var fname = "package-log-"+todayISO()+".html";
    var rhtml = standaloneReport("Daily Package Log", prHead("Daily Package Log")+body);
    try{
      var rfile = new File([rhtml], fname, {type:"text/html"});
      if(navigator.canShare && navigator.canShare({files:[rfile]})){
        navigator.share({files:[rfile], title:"Daily Package Log"}).catch(function(){});
        return;
      }
    }catch(e){}
    const ok = downloadReport(fname, rhtml);
    toast(ok ? "Log saved to Files \u2014 open it there, then Share \u2192 Print" : "Couldn't save the log.");
    return;
  }
  doPrint("Daily Package Log", body);
};
